<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Issue Tracker Dashboard</title>
    <script src='https://cdn.plot.ly/plotly-2.24.1.min.js'></script>
    <script src='https://cdn.tailwindcss.com'></script>
    <style>
        .chart-container {
            height: 100%;
        }

        .dimmed {
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
</head>

<body
    class='bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200 h-screen overflow-hidden flex flex-col'>
    <div class='flex-none px-4 pt-4'>
        <div class='grid grid-cols-1 md:grid-cols-4 gap-4 mb-4'>
            <div
                class='bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-5'>
                <div>
                    <label class='block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2'>View Mode</label>
                    <select id='modeSelect'
                        class='w-full border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100'>
                        <option value='status'>Status</option>
                        <option value='tags'>Top Tags</option>
                        <option value='total'>Total Issues</option>
                    </select>
                </div>
                <div>
                    <label class='block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2'>Channel</label>
                    <div class='flex flex-col gap-2'>
                        <label
                            class='inline-flex items-center gap-2 cursor-pointer text-sm text-gray-700 dark:text-gray-300'>
                            <input type='checkbox' id='channelBugs' value='bugs' checked
                                class='rounded border-gray-300 dark:border-gray-600 text-indigo-600 focus:ring-indigo-500'>
                            Bugs
                        </label>
                        <label
                            class='inline-flex items-center gap-2 cursor-pointer text-sm text-gray-700 dark:text-gray-300'>
                            <input type='checkbox' id='channelFeatures' value='features' checked
                                class='rounded border-gray-300 dark:border-gray-600 text-indigo-600 focus:ring-indigo-500'>
                            Features
                        </label>
                    </div>
                </div>
            </div>

            <div class='md:col-span-3'>
                <div id='statusContainer'
                    class='hidden bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700'>
                    <div class='flex justify-between items-center mb-2'>
                        <label class='block text-sm font-semibold text-gray-700 dark:text-gray-300'>Status
                            Filter</label>
                        <button id='resetStatusBtn'
                            class='text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-medium'>Reset
                            to Default</button>
                    </div>
                    <div id='statusFilters'
                        class='flex flex-wrap gap-2 p-2 border border-gray-200 dark:border-gray-600 rounded'>
                        <!-- Dynamic checkboxes -->
                    </div>
                </div>
                <div id='tagsContainer'
                    class='hidden bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700'>
                    <div class='flex justify-between items-center mb-2'>
                        <div class='flex items-center gap-3'>
                            <label class='block text-sm font-semibold text-gray-700 dark:text-gray-300'>Tags</label>
                            <button id='advancedToggleBtn'
                                class='text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-medium'>Advanced</button>
                            <span id='syntaxHint' class='hidden relative group'>
                                <span
                                    class='text-sm text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 cursor-help select-none'>ⓘ</span>
                                <div
                                    class='pointer-events-none absolute left-0 top-6 z-20 hidden group-hover:block w-72 rounded-lg border border-gray-200 bg-white p-3 shadow-lg dark:border-gray-600 dark:bg-gray-900'>
                                    <p class='mb-2 font-semibold text-gray-800 dark:text-gray-100'>Expression syntax</p>
                                    <div
                                        class='space-y-1 text-xs text-gray-600 dark:text-gray-300 leading-relaxed font-mono'>
                                        <p><span class='text-indigo-600 dark:text-indigo-400'>Blocker</span> <span
                                                class='font-sans text-gray-400'>— has tag</span></p>
                                        <p><span class='text-indigo-600 dark:text-indigo-400'>-Blocker</span> <span
                                                class='font-sans text-gray-400'>— does not have tag</span></p>
                                        <p><span class='text-indigo-600 dark:text-indigo-400'>A AND B</span> <span
                                                class='font-sans text-gray-400'>— both</span></p>
                                        <p><span class='text-indigo-600 dark:text-indigo-400'>A OR B</span> <span
                                                class='font-sans text-gray-400'>— either</span></p>
                                        <p><span class='text-indigo-600 dark:text-indigo-400'>(A OR B) AND -C</span>
                                            <span class='font-sans text-gray-400'>— grouping</span></p>
                                    </div>
                                    <p class='mt-2 text-xs text-gray-400 dark:text-gray-500'>Multi-word tags work
                                        without quotes:<br><span
                                            class='font-mono text-indigo-600 dark:text-indigo-400'>High Priority AND
                                            -Closed</span></p>
                                </div>
                            </span>
                        </div>
                        <div class='flex gap-2'>
                            <button id='addQueryBtn'
                                class='hidden text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-medium'>+
                                Series</button>
                            <button id='resetTagsBtn'
                                class='text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-medium'>Reset
                                to Default</button>
                        </div>
                    </div>
                    <div id='simpleTagsList'
                        class='flex flex-col gap-1.5 p-2 border border-gray-200 dark:border-gray-600 rounded max-h-52 overflow-y-auto'>
                        <!-- Dynamic tag checkboxes -->
                    </div>
                    <div id='queryList' class='hidden space-y-2 max-h-52 overflow-y-auto'>
                        <!-- Dynamic query builder -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class='flex-1 min-h-0 px-4 pb-4'>
        <div
            class='bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 h-full'>
            <div id='chart' class='chart-container'></div>
        </div>
    </div>

    <script>
        let data = [];
        let queries = [];
        let channelDecoded = {};
        let tagsMode = 'simple';   // 'simple' | 'advanced'
        let selectedTags = [];

        const QUERY_COLORS = [
            '#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
            '#06b6d4', '#84cc16', '#f97316', '#ec4899', '#14b8a6',
        ];

        const channelBugs = document.getElementById('channelBugs');
        const channelFeatures = document.getElementById('channelFeatures');
        const modeSelect = document.getElementById('modeSelect');

        function getActiveChannels() {
            const chs = [];
            if (channelBugs.checked) chs.push('bugs');
            if (channelFeatures.checked) chs.push('features');
            return chs;
        }
        const statusContainer = document.getElementById('statusContainer');
        const statusFilters = document.getElementById('statusFilters');
        const resetStatusBtn = document.getElementById('resetStatusBtn');
        const tagsContainer = document.getElementById('tagsContainer');
        const queryList = document.getElementById('queryList');
        const resetTagsBtn = document.getElementById('resetTagsBtn');
        const addQueryBtn = document.getElementById('addQueryBtn');
        const advancedToggleBtn = document.getElementById('advancedToggleBtn');
        const simpleTagsList = document.getElementById('simpleTagsList');

        const DEFAULT_STATUSES = ['open', 'pending', 'unknown'];
        const DEFAULT_TAGS = ['Blocker', 'High Priority', 'Needs Backport', 'Crash'];

        const INPUT_CLS = 'text-xs border border-gray-300 dark:border-gray-500 rounded px-1.5 py-0.5 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100';

        // ── Expression parser ─────────────────────────────────────────────────
        // Grammar:  expr = or_expr
        //           or_expr  = and_expr  (OR  and_expr)*
        //           and_expr = not_expr  (AND not_expr)*
        //           not_expr = '-' not_expr | atom
        //           atom     = TAG | '(' expr ')'
        //
        // Tag names may contain spaces (e.g. "High Priority"); they are greedily
        // collected up to the next AND/OR/NOT keyword or punctuation.

        function tokenize(expr) {
            const tokens = [];
            let i = 0;
            while (i < expr.length) {
                while (i < expr.length && (expr[i] === ' ' || expr[i] === '\t')) i++;
                if (i >= expr.length) break;
                if (expr[i] === '(') { tokens.push({ type: 'LPAREN' }); i++; continue; }
                if (expr[i] === ')') { tokens.push({ type: 'RPAREN' }); i++; continue; }
                if (expr[i] === '-') { tokens.push({ type: 'NOT' }); i++; continue; }
                const kw = expr.slice(i).match(/^(AND|OR|NOT)(?=[^a-zA-Z0-9]|$)/i);
                if (kw) { tokens.push({ type: kw[1].toUpperCase() }); i += kw[1].length; continue; }
                let j = i;
                while (j < expr.length) {
                    const c = expr[j];
                    if (c === '(' || c === ')' || c === '-') break;
                    if (/^(AND|OR|NOT)(?=[^a-zA-Z0-9]|$)/i.test(expr.slice(j))) break;
                    j++;
                }
                const name = expr.slice(i, j).trim();
                if (name) tokens.push({ type: 'TAG', value: name });
                i = j;
            }
            return tokens;
        }

        function parseExpr(tokens) {
            let pos = 0;
            const peek = () => tokens[pos];
            const consume = () => tokens[pos++];
            function parseOr() {
                let left = parseAnd();
                while (peek()?.type === 'OR') { consume(); left = { op: 'or', l: left, r: parseAnd() }; }
                return left;
            }
            function parseAnd() {
                let left = parseNot();
                while (peek()?.type === 'AND') { consume(); left = { op: 'and', l: left, r: parseNot() }; }
                return left;
            }
            function parseNot() {
                if (peek()?.type === 'NOT') { consume(); return { op: 'not', child: parseNot() }; }
                return parseAtom();
            }
            function parseAtom() {
                const t = peek();
                if (!t) return { op: 'lit', v: false };
                if (t.type === 'TAG') { consume(); return { op: 'tag', name: t.value }; }
                if (t.type === 'LPAREN') { consume(); const n = parseOr(); if (peek()?.type === 'RPAREN') consume(); return n; }
                consume();
                return { op: 'lit', v: false };
            }
            return parseOr();
        }

        function evalAst(ast, tagIndex, lo, hi) {
            switch (ast.op) {
                case 'tag': {
                    const bit = tagIndex[ast.name];
                    if (bit === undefined) return false;
                    return bit < 32 ? (lo & (1 << bit)) !== 0 : (hi & (1 << (bit - 32))) !== 0;
                }
                case 'not': return !evalAst(ast.child, tagIndex, lo, hi);
                case 'and': return evalAst(ast.l, tagIndex, lo, hi) && evalAst(ast.r, tagIndex, lo, hi);
                case 'or': return evalAst(ast.l, tagIndex, lo, hi) || evalAst(ast.r, tagIndex, lo, hi);
                default: return ast.v;
            }
        }

        function getAllStatuses() {
            const merged = getChannelSnapshot(data[data.length - 1], 'all');
            return Object.keys(merged.status).sort();
        }

        function getAllTags() {
            const set = new Set();
            if (channelDecoded.bugs) for (const t of channelDecoded.bugs.tags) set.add(t);
            if (channelDecoded.features) for (const t of channelDecoded.features.tags) set.add(t);
            return Array.from(set).sort();
        }

        function computeQueryCounts(activeChannels, query) {
            const counts = new Array(data.length).fill(0);
            const ast = parseExpr(tokenize(query.expr || ''));
            for (const ch of activeChannels) {
                if (!channelDecoded[ch]) continue;
                const { tags, snapshots } = channelDecoded[ch];
                const tagIndex = Object.fromEntries(tags.map((t, i) => [t, i]));
                for (let i = 0; i < snapshots.length && i < data.length; i++) {
                    const { _tagLos, _tagHis } = snapshots[i];
                    let c = 0;
                    for (let j = 0; j < _tagLos.length; j++) {
                        if (evalAst(ast, tagIndex, _tagLos[j], _tagHis[j])) c++;
                    }
                    counts[i] += c;
                }
            }
            return counts;
        }

        // ── Tag autocomplete ──────────────────────────────────────────────────
        // Extracts the tag name fragment the user is currently typing, by
        // splitting the expression on operators/punctuation and taking the
        // last piece.
        function getPartialTag(value, cursorPos) {
            const prefix = value.slice(0, cursorPos);
            const parts = prefix.split(/\b(?:AND|OR|NOT)\b|[()\-]/i);
            return parts[parts.length - 1].trimStart();
        }

        let _acDropdown = null, _acHighlighted = -1;
        function acItems() { return _acDropdown ? Array.from(_acDropdown.children) : []; }
        function acClose() { _acDropdown?.remove(); _acDropdown = null; _acHighlighted = -1; }
        function acHighlight(i) {
            acItems().forEach((el, idx) => {
                el.classList.toggle('bg-indigo-50', idx === i);
                el.classList.toggle('dark:bg-indigo-900', idx === i);
            });
            _acHighlighted = i;
        }
        function acOpen(input, partial, onSelect) {
            acClose();
            if (!partial.trim()) return;
            const matches = getAllTags().filter(t =>
                t.toLowerCase().startsWith(partial.toLowerCase()) &&
                t.toLowerCase() !== partial.toLowerCase()
            );
            if (!matches.length) return;
            const rect = input.getBoundingClientRect();
            _acDropdown = document.createElement('div');
            _acDropdown.className = 'fixed z-50 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded shadow-lg max-h-40 overflow-y-auto text-xs';
            _acDropdown.style.cssText = `top:${rect.bottom + 2}px;left:${rect.left}px;min-width:${rect.width}px`;
            matches.slice(0, 10).forEach(tag => {
                const item = document.createElement('div');
                item.className = 'px-3 py-1.5 cursor-pointer text-gray-900 dark:text-gray-100';
                item.textContent = tag;
                item.onmousedown = e => { e.preventDefault(); onSelect(tag); acClose(); };
                _acDropdown.appendChild(item);
            });
            document.body.appendChild(_acDropdown);
        }
        function acAttach(input, getExpr, setExpr) {
            input.addEventListener('input', () => {
                const partial = getPartialTag(input.value, input.selectionStart);
                acOpen(input, partial, tag => {
                    const pos = input.selectionStart;
                    input.value = input.value.slice(0, pos - partial.length) + tag + input.value.slice(pos);
                    input.selectionStart = input.selectionEnd = pos - partial.length + tag.length;
                    setExpr(input.value);
                });
                setExpr(input.value);
            });
            input.addEventListener('keydown', e => {
                if (!_acDropdown) return;
                const count = acItems().length;
                if (e.key === 'ArrowDown') { e.preventDefault(); acHighlight((_acHighlighted + 1) % count); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); acHighlight((_acHighlighted - 1 + count) % count); }
                else if (e.key === 'Enter' && _acHighlighted >= 0) { e.preventDefault(); acItems()[_acHighlighted].onmousedown(e); }
                else if (e.key === 'Escape' || e.key === 'Tab') acClose();
            });
            input.addEventListener('blur', () => setTimeout(acClose, 150));
        }

        function renderSimpleTags() {
            const TAG_GROUPS = [
                { label: 'Status', tags: ['Open', 'Closed', 'Added', 'Fixed', 'Fixed: Needs Testing', 'Added: Needs testing', 'Already Exists', 'Denied', 'Duplicate', 'Solved (No Bug)', 'Stale'] },
                { label: 'Priority', tags: ['Blocker', 'Crash', 'High Priority', 'Low Priority', 'Simple', 'Difficult to add'] },
                { label: 'Process', tags: ['Needs Backport', 'DevDiscussion', 'Needs More Info', 'See Pins', 'WIP'] },
                { label: 'Assignee', tags: ['Connor', 'Deathrider', 'Deedee', 'Emily', 'Moosh', 'Unassigned'] },
            ];

            simpleTagsList.innerHTML = '';
            const allTags = getAllTags();
            const knownTags = new Set(TAG_GROUPS.flatMap(g => g.tags));
            const otherTags = allTags.filter(t => !knownTags.has(t));
            const groups = otherTags.length
                ? [...TAG_GROUPS, { label: 'Other', tags: otherTags }]
                : TAG_GROUPS;

            const CHIP_CLS = 'inline-flex items-center px-2 py-1 rounded bg-gray-100 dark:bg-gray-700 text-xs cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-900 dark:text-gray-100 border border-transparent dark:border-gray-600';

            groups.forEach(group => {
                const present = group.tags.filter(t => allTags.includes(t));
                if (!present.length) return;

                const row = document.createElement('div');
                row.className = 'flex items-center gap-1.5 flex-wrap';

                const groupLabel = document.createElement('span');
                groupLabel.className = 'text-xs text-gray-400 dark:text-gray-500 w-16 shrink-0 text-right pr-1 border-r border-gray-200 dark:border-gray-600';
                groupLabel.textContent = group.label;
                row.appendChild(groupLabel);

                present.forEach(tag => {
                    const label = document.createElement('label');
                    label.className = CHIP_CLS;
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = 'mr-1';
                    cb.value = tag;
                    cb.checked = selectedTags.includes(tag);
                    cb.onchange = () => {
                        if (cb.checked) selectedTags = [...selectedTags, tag];
                        else selectedTags = selectedTags.filter(t => t !== tag);
                        updateChart();
                        updateUrl();
                    };
                    label.append(cb, document.createTextNode(tag));
                    row.appendChild(label);
                });

                simpleTagsList.appendChild(row);
            });
        }

        function renderTagsPanel() {
            const isAdvanced = tagsMode === 'advanced';
            advancedToggleBtn.textContent = isAdvanced ? 'Simple' : 'Advanced';
            addQueryBtn.classList.toggle('hidden', !isAdvanced);
            document.getElementById('syntaxHint').classList.toggle('hidden', !isAdvanced);
            simpleTagsList.classList.toggle('hidden', isAdvanced);
            queryList.classList.toggle('hidden', !isAdvanced);
            if (isAdvanced) renderQueryBuilder();
            else renderSimpleTags();
        }

        function renderQueryBuilder() {
            queryList.innerHTML = '';
            queries.forEach((query, qi) => {
                const color = QUERY_COLORS[qi % QUERY_COLORS.length];
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2';

                const dot = document.createElement('span');
                dot.style.cssText = `display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0`;

                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = query.name;
                nameInput.placeholder = 'Label';
                nameInput.className = INPUT_CLS + ' w-28 flex-shrink-0';
                nameInput.onchange = () => { query.name = nameInput.value; updateChart(); updateUrl(); };

                const exprInput = document.createElement('input');
                exprInput.type = 'text';
                exprInput.value = query.expr;
                exprInput.placeholder = 'e.g. Blocker AND -Closed';
                exprInput.className = INPUT_CLS + ' flex-1 min-w-0';
                acAttach(exprInput, () => query.expr, v => { query.expr = v; updateChart(); updateUrl(); });

                const removeBtn = document.createElement('button');
                removeBtn.textContent = '×';
                removeBtn.className = 'text-xs text-red-500 hover:text-red-700 font-bold flex-shrink-0';
                removeBtn.onclick = () => { queries.splice(qi, 1); renderQueryBuilder(); updateChart(); updateUrl(); };

                row.append(dot, nameInput, exprInput, removeBtn);
                queryList.appendChild(row);
            });
        }

        function isDarkMode() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function updateUrl() {
            const params = new URLSearchParams();
            params.set('channel', getActiveChannels().join(','));
            params.set('mode', modeSelect.value);
            if (modeSelect.value === 'tags') {
                params.set('tagsMode', tagsMode);
                if (tagsMode === 'simple') params.set('tags', selectedTags.join(','));
                else params.set('queries', JSON.stringify(queries));
            }
            if (modeSelect.value === 'status') {
                const selectedStatuses = Array.from(statusFilters.querySelectorAll('input:checked')).map(cb => cb.value);
                params.set('statuses', selectedStatuses.join(','));
            }
            window.history.replaceState({}, '', window.location.pathname + '?' + params.toString());
        }

        function loadFromUrl() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('channel')) {
                const chs = params.get('channel').split(',');
                channelBugs.checked = chs.includes('bugs');
                channelFeatures.checked = chs.includes('features');
            }
            if (params.has('mode')) modeSelect.value = params.get('mode');
            if (params.has('tagsMode')) tagsMode = params.get('tagsMode');
            return {
                tags: params.get('tags')?.split(',').filter(Boolean) || null,
                queries: JSON.parse(params.get('queries') || 'null'),
                statuses: params.get('statuses')?.split(',').filter(Boolean) || null,
            };
        }

        function getChannelSnapshot(entry, channel) {
            if (channel !== 'all') return entry.channels[channel];
            const channels = Object.values(entry.channels);
            const merged = { total: 0, status: {}, tags: {} };
            for (const ch of channels) {
                merged.total += ch.total || 0;
                for (const [s, count] of Object.entries(ch.status || {})) {
                    merged.status[s] = (merged.status[s] || 0) + count;
                }
                for (const [tag, count] of Object.entries(ch.tags || {})) {
                    merged.tags[tag] = (merged.tags[tag] || 0) + count;
                }
            }
            return merged;
        }

        function updateChart(forceStatuses = null) {
            const activeChannels = getActiveChannels();
            const channel = activeChannels.length === 1 ? activeChannels[0] : 'all';
            const mode = modeSelect.value;
            const dark = isDarkMode();
            const isAll = activeChannels.length !== 1;

            statusContainer.classList.toggle('hidden', mode !== 'status');
            tagsContainer.classList.toggle('hidden', mode !== 'tags');

            const dates = data.map(d => d.date);
            let traces = [];

            if (mode === 'total') {
                activeChannels.forEach(ch => {
                    traces.push({
                        x: dates,
                        y: data.map(d => d.channels[ch].total),
                        type: 'scatter',
                        mode: 'lines',
                        fill: isAll ? 'none' : 'tozeroy',
                        name: isAll ? ch.charAt(0).toUpperCase() + ch.slice(1) : 'Total Issues',
                        line: { color: dark ? '#818cf8' : '#6366f1' }
                    });
                });
            } else if (mode === 'status') {
                if (!statusFilters.dataset.built) {
                    statusFilters.dataset.built = 'true';
                    getAllStatuses().forEach(status => {
                        const label = document.createElement('label');
                        label.className = 'inline-flex items-center px-2 py-1 rounded bg-gray-100 dark:bg-gray-700 text-xs cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-900 dark:text-gray-100 border border-transparent dark:border-gray-600';
                        const cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.className = 'mr-1';
                        cb.value = status;
                        cb.checked = (forceStatuses || DEFAULT_STATUSES).includes(status);
                        cb.onchange = () => { updateChart(); updateUrl(); };
                        label.appendChild(cb);
                        label.appendChild(document.createTextNode(status.charAt(0).toUpperCase() + status.slice(1)));
                        statusFilters.appendChild(label);
                    });
                }
                Array.from(statusFilters.querySelectorAll('input:checked')).map(cb => cb.value).forEach(status => {
                    traces.push({
                        x: dates,
                        y: data.map(d => (getChannelSnapshot(d, channel).status[status] || 0)),
                        name: status.charAt(0).toUpperCase() + status.slice(1),
                        stackgroup: 'one',
                    });
                });
            } else if (mode === 'tags') {
                const allTags = getAllTags();
                const series = tagsMode === 'simple'
                    ? selectedTags.map(t => ({ name: t, expr: t }))
                    : queries;
                series.forEach((query, qi) => {
                    const colorIdx = tagsMode === 'simple'
                        ? allTags.indexOf(query.name) % QUERY_COLORS.length
                        : qi % QUERY_COLORS.length;
                    const counts = computeQueryCounts(activeChannels, query);
                    traces.push({
                        x: dates,
                        y: counts,
                        type: 'scatter',
                        mode: 'lines',
                        name: query.name,
                        line: { color: QUERY_COLORS[colorIdx] },
                    });
                });
            }

            const layout = {
                title: {
                    text: (channel === 'all' ? 'All Channels' : channel.charAt(0).toUpperCase() + channel.slice(1)) + ' Trends',
                    font: {
                        size: 24,
                        family: 'Inter, sans-serif',
                        weight: '800',
                        color: dark ? '#f3f4f6' : '#111827'
                    }
                },
                hovermode: 'x unified',
                hoverlabel: {
                    bgcolor: dark ? '#1f2937' : '#ffffff',
                    font: {
                        color: dark ? '#f3f4f6' : '#111827',
                        family: 'Inter, sans-serif'
                    },
                    bordercolor: dark ? '#4b5563' : '#e5e7eb'
                },
                xaxis: {
                    title: 'Date',
                    gridcolor: dark ? '#374151' : '#f3f4f6',
                    tickfont: { color: dark ? '#9ca3af' : '#4b5563' },
                    titlefont: { color: dark ? '#9ca3af' : '#4b5563' }
                },
                yaxis: {
                    title: 'Count',
                    gridcolor: dark ? '#374151' : '#f3f4f6',
                    tickfont: { color: dark ? '#9ca3af' : '#4b5563' },
                    titlefont: { color: dark ? '#9ca3af' : '#4b5563' }
                },
                legend: {
                    orientation: 'h',
                    y: -0.2,
                    font: { color: dark ? '#f3f4f6' : '#111827' }
                },
                margin: { t: 80, b: 100, l: 60, r: 20 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
            };

            Plotly.newPlot('chart', traces, layout, { responsive: true });
        }

        function armReset(btn, action) {
            if (btn._resetTimer) {
                clearTimeout(btn._resetTimer);
                btn._resetTimer = null;
                btn.textContent = 'Reset to Default';
                btn.classList.remove('text-red-500', 'dark:text-red-400');
                btn.classList.add('text-indigo-600', 'dark:text-indigo-400');
                action();
                return;
            }
            btn.textContent = 'Sure?';
            btn.classList.remove('text-indigo-600', 'dark:text-indigo-400');
            btn.classList.add('text-red-500', 'dark:text-red-400');
            btn._resetTimer = setTimeout(() => {
                btn._resetTimer = null;
                btn.textContent = 'Reset to Default';
                btn.classList.remove('text-red-500', 'dark:text-red-400');
                btn.classList.add('text-indigo-600', 'dark:text-indigo-400');
            }, 3000);
        }

        resetStatusBtn.onclick = () => armReset(resetStatusBtn, () => {
            statusFilters.querySelectorAll('input').forEach(cb => {
                cb.checked = DEFAULT_STATUSES.includes(cb.value);
            });
            updateChart();
            updateUrl();
        });

        resetTagsBtn.onclick = () => armReset(resetTagsBtn, () => {
            if (tagsMode === 'simple') {
                selectedTags = [...DEFAULT_TAGS];
            } else {
                queries = DEFAULT_TAGS.map(t => ({ name: t, expr: t }));
            }
            renderTagsPanel();
            updateChart();
            updateUrl();
        });

        addQueryBtn.onclick = () => {
            queries.push({ name: 'New Series', expr: '' });
            renderQueryBuilder();
            updateChart();
            updateUrl();
        };

        advancedToggleBtn.onclick = () => {
            tagsMode = tagsMode === 'simple' ? 'advanced' : 'simple';
            renderTagsPanel();
            updateChart();
            updateUrl();
        };

        channelBugs.onchange = () => { updateChart(); updateUrl(); };
        channelFeatures.onchange = () => { updateChart(); updateUrl(); };
        modeSelect.onchange = () => { updateChart(); updateUrl(); };

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => updateChart());
        document.addEventListener('click', e => { if (_acDropdown && !_acDropdown.contains(e.target)) acClose(); });

        const BIN_BASE = 'https://raw.githubusercontent.com/ZQuestClassic/discord-scripts/refs/heads/main/';

        async function decodeBin(url) {
            const buf = await (await fetch(url)).arrayBuffer();
            const bytes = new Uint8Array(buf);
            const view = new DataView(buf);

            const magic = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
            if (magic !== 'SNAP') throw new Error(`Invalid magic: ${magic}`);
            const version = bytes[4];
            if (version !== 2) throw new Error(`Unknown version: ${version}`);

            let offset = 5;
            const dec = new TextDecoder();

            function readStrTable() {
                const count = bytes[offset++];
                const strs = [];
                for (let i = 0; i < count; i++) {
                    const len = bytes[offset++];
                    strs.push(dec.decode(bytes.subarray(offset, offset + len)));
                    offset += len;
                }
                return strs;
            }

            const statuses = readStrTable();
            const tags = readStrTable();

            const snapshots = [];
            const state = new Map(); // BigInt id -> [statusIdx, tagLo, tagHi]

            while (offset < buf.byteLength) {
                const tsLo = view.getUint32(offset, true);
                const tsHi = view.getUint32(offset + 4, true);
                const timestamp_ms = tsHi * 0x100000000 + tsLo;
                offset += 8;

                offset += 4; // entryLength (unused during sequential read)

                const nAdded = view.getUint16(offset, true);
                const nRemoved = view.getUint16(offset + 2, true);
                offset += 4;

                for (let i = 0; i < nAdded; i++) {
                    const idLo = view.getUint32(offset, true);
                    const idHi = view.getUint32(offset + 4, true);
                    const id = BigInt(idHi) * 0x100000000n + BigInt(idLo);
                    offset += 8;
                    const statusIdx = bytes[offset++];
                    const tagLo = view.getUint32(offset, true);
                    const tagHi = view.getUint32(offset + 4, true);
                    offset += 8;
                    state.set(id, [statusIdx, tagLo, tagHi]);
                }

                for (let i = 0; i < nRemoved; i++) {
                    const idLo = view.getUint32(offset, true);
                    const idHi = view.getUint32(offset + 4, true);
                    const id = BigInt(idHi) * 0x100000000n + BigInt(idLo);
                    offset += 8;
                    state.delete(id);
                }

                const statusCounts = {};
                const tagCounts = {};
                const stateVals = Array.from(state.values());
                const _tagLos = new Uint32Array(stateVals.length);
                const _tagHis = new Uint32Array(stateVals.length);

                for (let j = 0; j < stateVals.length; j++) {
                    const [statusIdx, tagLo, tagHi] = stateVals[j];
                    const s = statuses[statusIdx];
                    statusCounts[s] = (statusCounts[s] || 0) + 1;
                    for (let b = 0; b < 32; b++) {
                        if (tagLo & (1 << b)) { const t = tags[b]; tagCounts[t] = (tagCounts[t] || 0) + 1; }
                        if (tagHi & (1 << b)) { const t = tags[32 + b]; if (t) tagCounts[t] = (tagCounts[t] || 0) + 1; }
                    }
                    _tagLos[j] = tagLo;
                    _tagHis[j] = tagHi;
                }

                snapshots.push({ timestamp_ms, total: state.size, status: statusCounts, tags: tagCounts, _tagLos, _tagHis });
            }

            return { statuses, tags, snapshots };
        }

        async function loadData() {
            const [bugResult, featResult] = await Promise.all([
                decodeBin(BIN_BASE + 'snapshot-bugs.bin'),
                decodeBin(BIN_BASE + 'snapshot-features.bin'),
            ]);

            channelDecoded.bugs = bugResult;
            channelDecoded.features = featResult;

            const bugSnaps = bugResult.snapshots;
            const featSnaps = featResult.snapshots;
            const count = Math.min(bugSnaps.length, featSnaps.length);
            return Array.from({ length: count }, (_, i) => {
                const b = bugSnaps[i], f = featSnaps[i];
                return {
                    date: new Date((b.timestamp_ms + f.timestamp_ms) / 2).toISOString(),
                    channels: {
                        bugs: { total: b.total, status: b.status, tags: b.tags },
                        features: { total: f.total, status: f.status, tags: f.tags },
                    },
                };
            });
        }

        async function init() {
            data = await loadData();
            const { statuses: initialStatuses, tags: initialTags, queries: initialQueries } = loadFromUrl();
            selectedTags = initialTags ?? [...DEFAULT_TAGS];
            queries = initialQueries ?? DEFAULT_TAGS.map(t => ({ name: t, expr: t }));
            renderTagsPanel();
            updateChart(initialStatuses);
        }
        init();
    </script>
